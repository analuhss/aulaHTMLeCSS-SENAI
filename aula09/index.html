<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>

    <!-- CSS INTERNO -->
    <!--Ele fica no começo da página html  -->
    <style>
        h1 {
            color:rgb(204, 69, 69)
        }
    </style>

    <!-- CSS EXTERNO - O MELHOR -->
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>
    <!-- O Cascading Style Sheets (CSS) é o que da forma  -->

    <!-- CSS in line -->
    <!-- definindo diretamente na tag html </H1>
    Quando usar?
    Quando você estilizar um único elemento rapidamente(ex: testar uma cor diferente no botao)-->
    <h1 style="font-size: 120px;">Título</h1>

    <h2>DSI1-SESI - OS PIORES</h2>

</body>
</html>
