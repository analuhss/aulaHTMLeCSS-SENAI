    <h1>Entendendo o display</h1>
    <p>o <strong>display</strong> define com um elemento se comporta na página</p>

    <h2>1 Block</h2>
    <div class="block">Caixa 1</div>
    <div class="block">Caixa 2</div>
    <div class="block">Caixa 3</div>
    
    <h2>2 Inline</h2>

    <div class="inline">Caixa 2</div>
    <div class="inline">Caixa 3</div>
    
    <h2>3 Inline Block</h2>
    <div class="inlineBlock">Caixa 1</div>
    <div class="inlineBlock">Caixa 2</div>
    <div class="inlineBlock">Caixa 3</div>
</body>
